services:
  api:
    build: .
    image: sport-scraper:latest
    command: ["uvicorn", "sport_scraper.api.main:app", "--host", "0.0.0.0", "--port", "8080"]
    ports:
      - "8080:8080"
    environment:
      SPORT_SCRAPER_AUTH: "${SPORT_SCRAPER_AUTH:-0}"
    volumes:
      - sport_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/v1/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    build: .
    image: sport-scraper:latest
    command: ["python", "-m", "sport_scraper.cli", "worker", "--poll", "1"]
    volumes:
      - sport_data:/app/data
    restart: unless-stopped
    depends_on:
      - api

  # Periodic discovery of today's fixtures.
  scheduler:
    build: .
    image: sport-scraper:latest
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "while true; do python -m sport_scraper.cli sync; sleep 21600; done"
    volumes:
      - sport_data:/app/data
    restart: unless-stopped

  # Opt-in TLS terminator. Enable with: docker compose --profile https up
  # Set SITE_ADDRESS to a real domain for automatic Let's Encrypt certificates.
  caddy:
    image: caddy:2
    profiles: ["https"]
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: "${SITE_ADDRESS:-http://localhost}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    depends_on:
      - api

volumes:
  sport_data:
  caddy_data:
  caddy_config:

